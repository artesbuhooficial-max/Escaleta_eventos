<style>
  /* ---------- Artes Búho brand tokens, sampled from Cuadrante de Oficina ---------- */
  :root, [data-theme="day"]{
    --bg:#fbf8f1;
    --bg-elev:#ffffff;
    --bg-elev2:#f2ecdd;
    --border:#e7dfcb;
    --text:#0e2146;
    --text-dim:#63708a;
    --text-faint:#a6accb;
    --blue:#4c73d6;
    --blue-deep:#2a46a8;
    --gold:#c6941f;
    --gold-fill:#d19f31;
    --green:#19a34b;
    --red:#dc2625;
    --teal:#2ca0bb;
    --violet:#7c53c9;
    --violet-deep:#5a35a6;
    --header-grad:linear-gradient(135deg,#5c80dc 0%,#2a46a8 100%);
    --header-grad-b:linear-gradient(135deg,#a084e0 0%,#5a35a6 100%);
    --on-fill-text:#ffffff;
    --shadow:0 10px 28px rgba(20,30,70,.08);
  }
  [data-theme="night"]{
    --bg:#0e2146;
    --bg-elev:#142a57;
    --bg-elev2:#1c3568;
    --border:#28407a;
    --text:#f3eee2;
    --text-dim:#a2b0cf;
    --text-faint:#5c6e93;
    --blue:#7f9dee;
    --blue-deep:#4c73d6;
    --gold:#f0b94a;
    --gold-fill:#c6941f;
    --green:#34c97a;
    --red:#ff5b5a;
    --teal:#4dc3de;
    --violet:#b79cf0;
    --violet-deep:#8b5fd6;
    --header-grad:linear-gradient(135deg,#1c3568 0%,#081328 100%);
    --header-grad-b:linear-gradient(135deg,#3c2568 0%,#140a28 100%);
    --on-fill-text:#0e2146;
    --shadow:0 10px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;padding-bottom:44px;
    transition:background .5s ease,color .5s ease;
  }
  .mono{font-family:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;}
  .accent{font-family:'Lora',Georgia,serif;font-style:italic;color:var(--gold);}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  /* ---------- brand banner ---------- */
  .banner{
    background:var(--header-grad);position:relative;overflow:hidden;
    padding:16px 0 18px;transition:background .5s ease;
  }
  .banner.prod-paradela{background:var(--header-grad-b);}
  .banner::after{
    content:"";position:absolute;right:-70px;top:-60px;width:220px;height:220px;
    border-radius:50%;background:rgba(255,255,255,.07);
  }
  .banner-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .ab-badge{
    width:42px;height:42px;border-radius:11px;background:#fff;color:var(--blue-deep);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
    flex:none;letter-spacing:.01em;
  }
  .banner-title{color:#fff;font-weight:700;font-size:18px;line-height:1.15;}
  .banner-sub{color:rgba(255,255,255,.78);font-size:10.5px;letter-spacing:.14em;font-weight:600;margin-top:2px;}
  .banner-right{margin-left:auto;text-align:right;flex:none;}
  .liveclock{color:#fff;font-size:14px;}
  .syncline{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:2px;}
  .syncdot{width:6px;height:6px;border-radius:50%;background:#7CF2B4;}
  .syncdot.stale{background:rgba(255,255,255,.4);}
  .synclabel{color:rgba(255,255,255,.75);font-size:10px;}

  /* ---------- production tabs ---------- */
  .tabrow{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1;}
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:9px 6px 8px;border-radius:13px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);cursor:pointer;transition:.15s;
  }
  .tab:active{transform:scale(.97);}
  .tab-dot{width:7px;height:7px;border-radius:50%;margin-bottom:2px;background:#fff;}
  .tab-name{color:#fff;font-size:12.5px;font-weight:700;line-height:1.2;}
  .tab-date{color:rgba(255,255,255,.75);font-size:10px;font-weight:600;letter-spacing:.03em;margin-top:1px;}
  .tab.active{background:#fff;}
  .tab.active .tab-name{color:var(--tab-ink);}
  .tab.active .tab-date{color:var(--tab-ink);opacity:.7;}
  .tab.active .tab-dot{background:var(--tab-ink);}

  .pillrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1;}
  .pill{
    display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;
    background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:600;
    border:1px solid rgba(255,255,255,.18);cursor:pointer;transition:.15s;
  }
  .pill:active{transform:scale(.96);}
  .pill.solid{background:#fff;color:var(--blue-deep);}
  .pill svg{flex:none;}

  /* ---------- body head (event info) ---------- */
  .body-head{padding-top:20px;}
  .eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--gold);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
  .eyebrow .prodbadge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--on-fill-text);}
  h1.evtitle{font-size:23px;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.01em;}
  .evmeta{font-size:13px;color:var(--text-dim);margin-top:4px;}

  /* ---------- hero ---------- */
  .hero{
    margin-top:18px;border-radius:18px;border:1px solid var(--border);
    background:var(--bg-elev);box-shadow:var(--shadow);
    padding:20px 18px 18px;text-align:center;transition:.4s;
  }
  .cattag{
    display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;
    font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--on-fill-text);
  }
  .hero-label{font-size:17px;font-weight:700;margin:12px 0 16px;padding:0 6px;line-height:1.3;}
  .ring-wrap{position:relative;width:186px;height:186px;margin:0 auto 14px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:var(--bg-elev2);stroke-width:9;}
  .ring-fill{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .4s linear,stroke .3s;}
  .ring-fill.urgent{animation:ringpulse 1s ease-in-out infinite;}
  @keyframes ringpulse{0%,100%{opacity:1}50%{opacity:.5}}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-time{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;letter-spacing:-.01em;}
  .ring-sub{font-size:11px;color:var(--text-dim);margin-top:3px;letter-spacing:.04em;}
  .hero-next{font-size:13px;color:var(--text-dim);}
  .hero-next b{color:var(--text);font-weight:700;}

  /* ---------- legend ---------- */
  .legend{display:flex;gap:8px;overflow-x:auto;padding:16px 2px 4px;scrollbar-width:none;}
  .legend::-webkit-scrollbar{display:none;}
  .legend-item{
    flex:none;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    padding:5px 11px;border-radius:20px;color:var(--on-fill-text);
  }

  /* ---------- info card ---------- */
  .infocard{margin-top:14px;border-radius:16px;border:1px solid var(--border);background:var(--bg-elev);box-shadow:var(--shadow);padding:16px 16px 4px;}
  .info-block{margin-bottom:14px;}
  .info-block h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin:0 0 5px;font-weight:800;}
  .info-block p{font-size:13.5px;color:var(--text);line-height:1.5;margin:0;}
  .info-block a{color:var(--blue);text-decoration:none;font-weight:700;}
  .info-block a.mapline{display:inline-block;margin-top:3px;}
  .info-contacts{display:flex;flex-direction:column;}
  .info-contact{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:8px 0;border-top:1px solid var(--border);}
  .info-contact:first-child{border-top:none;}
  .info-contact .who{min-width:0;}
  .info-contact .role{color:var(--text-dim);font-size:11px;display:block;}
  .info-contact .name{font-weight:700;}
  .info-contact a{color:var(--blue);font-weight:700;text-decoration:none;font-family:'Space Mono',monospace;font-size:12px;flex:none;white-space:nowrap;}

  /* ---------- timeline ---------- */
  .timeline{margin-top:6px;display:flex;flex-direction:column;gap:7px;}
  .row{
    display:flex;align-items:stretch;gap:12px;background:var(--bg-elev);
    border:1px solid var(--border);border-radius:13px;padding:11px 13px;
    transition:.2s;box-shadow:var(--shadow);
  }
  .row .rail{width:5px;border-radius:3px;flex:none;}
  .row .body{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .row .time{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--text-dim);}
  .row .label{font-size:14.5px;margin-top:2px;color:var(--text);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;}
  .row .tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:10px;color:var(--on-fill-text);flex:none;}
  .row .status{flex:none;font-size:15px;width:20px;text-align:center;color:var(--text-faint);}
  .row.done{opacity:.45;}
  .row.done .label{text-decoration:line-through;text-decoration-color:var(--text-faint);}
  .row.current{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb, var(--blue) 25%, transparent);}
  .row.current .status{color:var(--blue);}

  /* ---------- edit mode ---------- */
  .section-title{font-size:10.5px;letter-spacing:.1em;color:var(--text-faint);margin:20px 2px 8px;font-weight:700;}
  .editfields{display:flex;flex-direction:column;gap:10px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;color:var(--text-dim);font-weight:600;}
  input[type=text],input[type=date],input[type=time],select{
    background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;width:100%;
  }
  input:focus,select:focus{outline:none;border-color:var(--blue);}
  .editrow{background:var(--bg-elev);border:1px solid var(--border);border-radius:13px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow);}
  .editrow-top{display:flex;gap:8px;margin-bottom:8px;}
  .editrow-top input[type=time]{flex:1;}
  .editrow-mid{display:flex;gap:8px;}
  .editrow-mid select{flex:none;width:150px;}
  .delbtn{flex:none;width:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg-elev2);color:var(--red);font-size:16px;cursor:pointer;}
  .addbtn{width:100%;padding:12px;border-radius:12px;border:1px dashed var(--border);background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;margin-top:4px;font-weight:600;}
  .savebar{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-ghost{background:var(--bg-elev2);color:var(--text-dim);border:1px solid var(--border);}
  .resetlink{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-faint);background:none;border:none;cursor:pointer;text-decoration:underline;width:100%;}
  .confirmbar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:12.5px;color:var(--text-dim);flex-wrap:wrap;}
  .confirmbar button{background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;}
  .confirmbar button.danger{color:var(--red);border-color:var(--red);}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:.3s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  ::selection{background:var(--blue);color:#fff;}
</style>
</head>

  function toMin(hhmm){
    var p = (hhmm||"00:00").split(":");
    return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0);
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }

  function computeAbs(sch){
    var base = new Date(sch.eventDate+"T00:00:00");
    var cursor = 0;
    var out = [];
    for (var i=0;i<sch.blocks.length;i++){
      var b = sch.blocks[i];
      var sMin = toMin(b.start);
      var k = Math.floor(cursor/1440);
      var candStart = sMin + k*1440;
      if (candStart < cursor) candStart += 1440;
      var eMin = toMin(b.end);
      var k2 = Math.floor(candStart/1440);
      var candEnd = eMin + k2*1440;
      if (candEnd <= candStart) candEnd += 1440;
      out.push({ id:b.id, label:b.label, cat:normalizeCat(b.cat), start:b.start, end:b.end,
                 absStart:candStart, absEnd:candEnd });
      cursor = candEnd;
    }
    return { base:base, blocks:out };
  }
  function nowAbsMinutes(base){ return (Date.now()-base.getTime())/60000; }

  function fmtRemain(minutes){
    if (minutes<0) minutes = 0;
    var totalSec = Math.round(minutes*60);
    var h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
    return h>0 ? (h+":"+pad(m)+":"+pad(s)) : (pad(m)+":"+pad(s));
  }
  function fmtClock(d){ return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }

  // ---------- theme ----------
  function isNightNow(){ var h = new Date().getHours(); return (h>=21 || h<7); }
  function applyTheme(){
    var eff = themeMode==="auto" ? (isNightNow()?"night":"day") : themeMode;
    document.documentElement.setAttribute("data-theme", eff);
  }
  function themeIcon(){
    if (themeMode==="day") return "☀️";
    if (themeMode==="night") return "🌙";

    if (themeMode==="day") return "Día";

  // ---------- storage abstraction ----------
  // window.storage only exists inside a Claude artifact. Outside that
  // (e.g. self-hosted on GitHub Pages) it's undefined, and calling it
  // directly throws synchronously before any .catch() can run — which
  // silently kills the whole boot sequence and leaves a blank page.
  // So: detect it, and fall back to localStorage (per-device only,
  // no cross-team sync) when it isn't present.
  var hasCloudStorage = (typeof window.storage !== "undefined" && window.storage !== null);

  function storageGet(key, shared){
    if (hasCloudStorage) return window.storage.get(key, shared);
    return new Promise(function(resolve, reject){
      try{
        var v = localStorage.getItem(key);
        if (v === null){ reject(new Error("not found")); return; }
        resolve({key:key, value:v, shared:!!shared});
      }catch(e){ reject(e); }
    });
  }
  function storageSet(key, value, shared){
    if (hasCloudStorage) return window.storage.set(key, value, shared);
    return new Promise(function(resolve, reject){
      try{
        localStorage.setItem(key, value);
        resolve({key:key, value:value, shared:!!shared});
      }catch(e){ reject(e); }
    });
  }

  // ---------- schedule loading / persistence (per production) ----------
  function loadProduction(id){
    return storageGet(STORAGE_PREFIX+id, true).then(function(res){
      if (res && res.value){
        productions[id] = JSON.parse(res.value);
        lastSyncAt[id] = Date.now();
      } else {
        productions[id] = defaultDataFor(id);
        persistProduction(id);
      }
    }).catch(function(){
      productions[id] = defaultDataFor(id);
      persistProduction(id);
    });
  }

  function loadAll(){
    productions = {};
    return Promise.all(PROD_ORDER.map(loadProduction)).then(function(){
      return storageGet(ACTIVE_KEY, false).then(function(res){
        if (res && res.value && PROD_META[res.value]) activeId = res.value;
        else activeId = pickDefaultId();
      }).catch(function(){ activeId = pickDefaultId(); });
    });
  }

  function pickDefaultId(){
    var now = Date.now();
    // 1) a production currently in progress wins
    for (var i=0;i<PROD_ORDER.length;i++){
      var id = PROD_ORDER[i];
      var abs = computeAbs(productions[id]);
      if (!abs.blocks.length) continue;
      var startMs = abs.base.getTime() + abs.blocks[0].absStart*60000;
      var endMs = abs.base.getTime() + abs.blocks[abs.blocks.length-1].absEnd*60000;
      if (now>=startMs && now<=endMs) return id;
    }
    // 2) otherwise the nearest upcoming one
    var best=null, bestDelta=Infinity;
    for (var j=0;j<PROD_ORDER.length;j++){
      var id2 = PROD_ORDER[j];
      var abs2 = computeAbs(productions[id2]);
      if (!abs2.blocks.length) continue;
      var startMs2 = abs2.base.getTime() + abs2.blocks[0].absStart*60000;
      var delta = startMs2 - now;
      if (delta>=0 && delta<bestDelta){ bestDelta=delta; best=id2; }
    }
    if (best) return best;
    // 3) everything's in the past — show the most recent one
    return PROD_ORDER[PROD_ORDER.length-1];
  }

  function persistProduction(id, attempt){
    attempt = attempt || 0;
    storageSet(STORAGE_PREFIX+id, JSON.stringify(productions[id]), true).then(function(res){
      if (!res) throw new Error("empty result");
      lastSyncAt[id] = Date.now();
      updateSyncUI();
    }).catch(function(){
      updateSyncUI();
      if (attempt < 6) setTimeout(function(){ persistProduction(id, attempt+1); }, 5000);
    });
  }

  function persistActiveId(){
    storageSet(ACTIVE_KEY, activeId, false).catch(function(){});
  }

  function pollRemote(){
    if (editMode) return;
    var id = activeId;
    storageGet(STORAGE_PREFIX+id, true).then(function(res){
      if (res && res.value){
        var remote = JSON.parse(res.value);
        if (remote.updatedAt !== productions[id].updatedAt){
          productions[id] = remote; pingedWarn = {};
          renderAll();
          showToast("Horario actualizado por el equipo");
        }
        lastSyncAt[id] = Date.now();
        updateSyncUI();
      }
    }).catch(function(){});
  }

  function currentSchedule(){ return productions[activeId]; }

  // ---------- audio / haptics ----------
  function beep(freq,dur){
    if (!soundOn) return;
    try{
      var ctx = window._roCtx || (window._roCtx = new (window.AudioContext||window.webkitAudioContext)());
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type="sine"; o.frequency.value=freq; g.gain.value=0.0001;
      o.connect(g); g.connect(ctx.destination);
      var t = ctx.currentTime;
      g.gain.exponentialRampToValueAtTime(0.18,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur/1000);
      o.start(t); o.stop(t+dur/1000+0.03);
    }catch(e){}
  }
  function buzz(pattern){ if (!soundOn) return; try{ if (navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

  // ---------- state ----------
  var lastCurrentId = null;

  function getState(){
    var sch = currentSchedule();
    var abs = computeAbs(sch);
    var now = nowAbsMinutes(abs.base);
    var blocks = abs.blocks;
    if (!blocks.length) return {phase:"empty"};
    if (now < blocks[0].absStart) return {phase:"pre", next:blocks[0], base:abs.base, blocks:blocks, now:now};
    if (now >= blocks[blocks.length-1].absEnd) return {phase:"post", last:blocks[blocks.length-1], base:abs.base, blocks:blocks, now:now};
    for (var i=0;i<blocks.length;i++){
      if (now>=blocks[i].absStart && now<blocks[i].absEnd){
        return {phase:"active", current:blocks[i], next:blocks[i+1]||null, base:abs.base, blocks:blocks, now:now};
      }
    }
    var nxt=null;
    for (var j=0;j<blocks.length;j++){ if (blocks[j].absStart>now){ nxt=blocks[j]; break; } }
    return {phase:"gap", next:nxt, base:abs.base, blocks:blocks, now:now};
  }

  function statusForBlock(b, st){
    if (st.phase==="pre") return "upcoming";
    if (st.phase==="post") return "done";
    if (st.phase==="active"){
      if (b.id===st.current.id) return "current";
      return b.absEnd<=st.current.absStart ? "done" : "upcoming";
    }
    if (st.phase==="gap") return (st.next && b.absStart<st.next.absStart) ? "done" : "upcoming";
    return "upcoming";
  }

  function renderTimeline(st){
    var tl = document.getElementById("timeline");
    if (!tl) return;
    var html = "";
    st.blocks.forEach(function(b){
      var status = statusForBlock(b, st);
      var cls = "row"+(status==="done"?" done":"")+(status==="current"?" current":"");
      var statIcon = status==="done" ? "✓" : (status==="current" ? "▶" : "");
      var cat = CATS[b.cat];
      html += '<div class="'+cls+'" data-id="'+b.id+'">'+
        '<div class="rail" style="background:'+cat.color+'"></div>'+
        '<div class="body"><div class="info">'+
          '<div class="time mono">'+b.start+' – '+b.end+'</div>'+
          '<div class="label">'+esc(b.label)+' <span class="tag" style="background:'+cat.color+'">'+(cat.lock?icon("lock")+' ':'')+cat.label+'</span></div>'+
        '</div><div class="status">'+statIcon+'</div></div>'+
      '</div>';
    });
    tl.innerHTML = html;
    var current = tl.querySelector(".row.current");
    if (current) current.scrollIntoView({block:"center", behavior:"smooth"});
  }

  var lastTimelineRender = 0;

  function tick(force){
    applyTheme();
    var clockEl = document.getElementById("liveclock");
    if (clockEl) clockEl.textContent = fmtClock(new Date());
    updateSyncUI();
    if (!productions || editMode) return;

    var st = getState();
    if (Date.now()-lastTimelineRender>4000 || force){
      renderTimeline(st); lastTimelineRender = Date.now();
    } else {
      var tl = document.getElementById("timeline");
      if (tl){
        st.blocks.forEach(function(b){
          var el = tl.querySelector('[data-id="'+b.id+'"]');
          if (!el) return;
          var status = statusForBlock(b, st);
          el.classList.toggle("done", status==="done");
          el.classList.toggle("current", status==="current");
          var iconEl = el.querySelector(".status");
          if (iconEl) iconEl.textContent = status==="done" ? "✓" : (status==="current" ? "▶" : "");
        });
      }
    }

    var tagEl = document.getElementById("cattag");
    var labelEl = document.getElementById("hero-label");
    var ringTime = document.getElementById("ring-time");
    var ringSub = document.getElementById("ring-sub");
    var ringFill = document.getElementById("ring-fill");
    var nextEl = document.getElementById("hero-next");
    if (!tagEl) return;

    function setTag(text, color){
      tagEl.textContent = text;
      tagEl.style.background = color || "var(--text-faint)";
    }

    if (st.phase==="pre"){
      var rem = st.next.absStart - st.now;
      setTag("PRÓXIMAMENTE", "var(--blue)");
      labelEl.textContent = "Empieza: "+st.next.label;
      ringTime.textContent = fmtRemain(rem);
      ringSub.textContent = "hasta "+st.next.start;
      nextEl.innerHTML = 'Primer bloque a las <b>'+st.next.start+'</b>';
      setRing(ringFill, 0, "var(--blue)", false);
    } else if (st.phase==="active"){
      var c = st.current, cat = CATS[c.cat];
      var total = c.absEnd-c.absStart, elapsed = st.now-c.absStart, remain = c.absEnd-st.now;
      var pct = Math.max(0, Math.min(1, elapsed/total));
      var urgent = remain<=3;
      setTag((cat.lock?"🔒 ":"")+cat.label.toUpperCase(), cat.color);
      labelEl.textContent = c.label;
      ringTime.textContent = fmtRemain(remain);
      ringTime.style.color = urgent ? "var(--red)" : "var(--text)";
      ringSub.textContent = "restantes";
      nextEl.innerHTML = st.next ? 'Siguiente: <b>'+st.next.label+'</b> a las '+st.next.start : 'Último bloque del servicio';
      setRing(ringFill, pct, cat.color, urgent);

      if (lastCurrentId !== c.id){
        if (lastCurrentId !== null){ beep(660,160); buzz([90,60,90]); }
        lastCurrentId = c.id; pingedWarn = {};
      }
      if (remain<=3 && !pingedWarn[c.id]){ pingedWarn[c.id]=true; beep(880,140); buzz([120]); }
    } else if (st.phase==="gap"){
      setTag("MARGEN", "var(--text-faint)");
      labelEl.textContent = st.next ? "Siguiente: "+st.next.label : "—";
      ringTime.textContent = st.next ? fmtRemain(st.next.absStart-st.now) : "--:--";
      ringSub.textContent = "hasta el siguiente bloque";
      nextEl.innerHTML = "";
      setRing(ringFill, 0, "var(--text-faint)", false);
    } else if (st.phase==="post"){
      setTag("FINALIZADO", "var(--green)");
      labelEl.textContent = st.last.label;
      ringTime.textContent = fmtRemain(st.now-st.last.absEnd);
      ringSub.textContent = "desde el fin";
      nextEl.innerHTML = "";
      setRing(ringFill, 1, "var(--green)", false);
    }
  }

  function setRing(el, pct, color, urgent){
    if (!el) return;
    var C = 477.5;
    el.setAttribute("stroke-dashoffset", (C*(1-pct)).toFixed(1));
    el.style.stroke = color;
    el.classList.toggle("urgent", !!urgent);
  }

  }

    html += '<div class="section-title">DATOS DEL SERVICIO — '+esc(PROD_META[activeId].tabName).toUpperCase()+'</div>';
    html += '<div class="editfields">'+
      '<div class="field"><label>Nombre del evento</label><input type="text" id="f-name" value="'+esc(editDraft.eventName)+'"></div>'+
      '<div class="field"><label>Lugar</label><input type="text" id="f-venue" value="'+esc(editDraft.venue)+'"></div>'+
      '<div class="field"><label>Fecha de inicio</label><input type="date" id="f-date" value="'+esc(editDraft.eventDate)+'"></div>'+
    '</div>';
    html += '<div class="section-title">BLOQUES</div><div id="editrows"></div>';
    html += '<button class="addbtn" id="btn-add">+ Añadir bloque</button>';
    html += '<div class="savebar"><button class="btn btn-ghost" id="btn-cancel">Cancelar</button>'+
      '<button class="btn btn-primary" id="btn-save">Guardar cambios</button></div>';
    html += '<button class="resetlink" id="btn-reset">Restaurar horario original</button>';
    html += '<div id="resetconfirm"></div>';
    html += '</div>';

    app.innerHTML = html;
    bindHeaderEvents();
    renderEditRows();

    document.getElementById("f-name").oninput = function(e){ editDraft.eventName=e.target.value; };
    document.getElementById("f-venue").oninput = function(e){ editDraft.venue=e.target.value; };
    document.getElementById("f-date").oninput = function(e){ editDraft.eventDate=e.target.value; };
    document.getElementById("btn-add").onclick = function(){
      var last = editDraft.blocks[editDraft.blocks.length-1];
      editDraft.blocks.push({id:uid(), start:last?last.end:"12:00", end:last?last.end:"12:30", label:"Nuevo bloque", cat:"logistica"});
      renderEditRows();
    };
    document.getElementById("btn-cancel").onclick = function(){ editMode=false; renderAll(); };
    document.getElementById("btn-save").onclick = function(){
      var ok = editDraft.blocks.every(function(b){ return b.label.trim() && b.start && b.end; });
      if (!ok){ showToast("Cada bloque necesita hora de inicio, fin y nombre"); return; }
      editDraft.updatedAt = new Date().toISOString();
      productions[activeId] = editDraft;
      editMode=false; pingedWarn={}; lastCurrentId=null;
      renderAll();
      showToast("Guardado en este dispositivo — sincronizando con el equipo…");
      persistProduction(activeId);
    };
    document.getElementById("btn-reset").onclick = function(){
      document.getElementById("resetconfirm").innerHTML =
        '<div class="confirmbar">¿Restaurar el horario original de '+esc(PROD_META[activeId].tabName)+' y descartar estos cambios?'+
        '<button id="rc-yes" class="danger">Sí, restaurar</button><button id="rc-no">Cancelar</button></div>';
      document.getElementById("rc-yes").onclick = function(){ editDraft = defaultDataFor(activeId); renderEdit(); };
      document.getElementById("rc-no").onclick = function(){ document.getElementById("resetconfirm").innerHTML=""; };
    };
  }

  function renderEditRows(){
    var wrap = document.getElementById("editrows");
    var html = "";
    editDraft.blocks.forEach(function(b, idx){
      html += '<div class="editrow" data-idx="'+idx+'">'+
        '<div class="editrow-top">'+
          '<input type="time" value="'+b.start+'" data-f="start" data-idx="'+idx+'">'+
          '<input type="time" value="'+b.end+'" data-f="end" data-idx="'+idx+'">'+
        '</div>'+
        '<div class="editrow-mid">'+
          '<input type="text" value="'+esc(b.label)+'" data-f="label" data-idx="'+idx+'" placeholder="Actividad">'+
          '<select data-f="cat" data-idx="'+idx+'">'+
            CAT_ORDER.map(function(k){ return '<option value="'+k+'"'+(k===b.cat?' selected':'')+'>'+CATS[k].label+'</option>'; }).join("")+
          '</select>'+
          '<button class="delbtn" data-del="'+idx+'">×</button>'+
        '</div>'+
      '</div>';
    });
    wrap.innerHTML = html;
    wrap.querySelectorAll("input,select").forEach(function(el){
      el.addEventListener("input", function(){
        var idx = parseInt(el.getAttribute("data-idx"),10), f = el.getAttribute("data-f");
        editDraft.blocks[idx][f] = el.value;
      });
    });
    wrap.querySelectorAll("[data-del]").forEach(function(el){
      el.addEventListener("click", function(){
        editDraft.blocks.splice(parseInt(el.getAttribute("data-del"),10),1);
        renderEditRows();
      });
    });
  }

  function bindHeaderEvents(){
    var s = document.getElementById("btn-sound");
    if (s) s.onclick = function(){ soundOn=!soundOn; if (soundOn) beep(880,120); renderAll(); };
    var e = document.getElementById("btn-edit");
    if (e) e.onclick = function(){ editMode=!editMode; renderAll(); };
    var i = document.getElementById("btn-info");
    if (i) i.onclick = function(){ infoOpen=!infoOpen; renderAll(); };
    var t = document.getElementById("btn-theme");
    if (t) t.onclick = function(){
      themeMode = themeMode==="auto" ? "day" : (themeMode==="day" ? "night" : "auto");
      renderAll();
    };
    var y = document.getElementById("btn-sync");
    if (y) y.onclick = function(){ pollRemote(); showToast(hasCloudStorage ? "Comprobando cambios del equipo…" : "Guardado solo en este dispositivo"); };
    document.querySelectorAll("[data-tab]").forEach(function(el){
      el.onclick = function(){
        var id = el.getAttribute("data-tab");
        if (id===activeId) return;
        activeId = id; editMode=false; pingedWarn={}; lastCurrentId=null;
        persistActiveId();
        renderAll();
      };
    });
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(window._toastT);
    window._toastT = setTimeout(function(){ t.classList.remove("show"); }, 3200);
  }

  // ---------- boot ----------
  applyTheme();
  loadAll().then(function(){
    renderAll();
    setInterval(tick, 1000);
    setInterval(pollRemote, 8000);
    setInterval(function(){
      if (!productions || editMode) return;
      var st = getState();
      var tag = PROD_META[activeId].tabName;
      var title = "Escaleta en Directo";
      if (st.phase==="active") title = "⏱ "+fmtRemain(st.current.absEnd-st.now)+" · "+st.current.label+" · "+tag;
      else if (st.phase==="pre") title = "⏱ "+fmtRemain(st.next.absStart-st.now)+" · antes de empezar · "+tag;
      else if (st.phase==="post") title = "✓ Finalizado · "+tag;
      document.title = title;
    }, 1000);
  });

})();
</script>
</body>
</html>
